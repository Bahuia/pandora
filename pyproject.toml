[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora"
version = "0.1.0"
description = "Unified structured knowledge reasoning with executable Pandas BOXes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Pandora Authors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dynamic = ["dependencies"]

[project.scripts]
pandora = "run:cli"
pandora-data = "pandora_data.cli:cli"

[project.urls]
Repository = "https://github.com/Bahuia/pandora"
Issues = "https://github.com/Bahuia/pandora/issues"

[tool.setuptools]
py-modules = ["run"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["configs*", "core*", "datasets*", "models*", "pandora_data*", "prompts*", "utils*"]

[tool.setuptools.package-data]
configs = ["**/*.yaml"]
prompts = ["tasks/**/*.txt"]
pandora_data = ["manifests/*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: requires benchmark assets that are not distributed"]

[tool.black]
line-length = 100
target-version = ["py39"]
