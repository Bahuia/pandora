# Pandora Default Configuration

# Model Settings
model:
  name: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 4096
  timeout: 120

# Inference Settings
inference:
  shot_k: 10                    # Number of few-shot examples
  max_tries: 3                  # Maximum retry attempts per example
  max_revision_rounds: 3        # L in the paper
  do_execution_guidance: true   # Enable execution-guided code revision
  do_final_execution_repair: true
  do_decomposition: true
  do_code_merge: true
  n_votes: 5                    # Number of votes for majority voting
  max_workers: 4                # Parallel inference workers
  preload_kb_info: false        # Load database metadata lazily for large benchmarks

# Question-level Box-Aware schema enrichment used by the paper.
schema_analysis:
  enabled: true
  use_offline_cache: false

# Paper-consistent task-agnostic knowledge transfer.
retrieval:
  enabled: true
  mode: "cross_task"            # cross_task | same_dataset | disabled
  model_name: "BAAI/bge-large-en-v1.5"
  memory_files:
    - "pandora.memory.db.json"
    - "pandora.memory.table.json"
    - "pandora.memory.kg.json"

# Execution Settings
execution:
  timeout: 30                   # Code execution timeout (seconds)
  max_memory_mb: 512            # Memory limit (MB)
  max_cpu_seconds: 30

# Logging Settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pandora.log"

# Paths
paths:
  data_root: "./data"
  result_root: "./results"
  prompt_root: "./prompts"
  cache_root: "./cache"
